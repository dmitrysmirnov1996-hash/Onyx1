<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="of" x1="0.18" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#252b38"/>
      <stop offset="0.55" stop-color="#14161f"/>
      <stop offset="1" stop-color="#0a0b10"/>
    </linearGradient>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8c9ff" stop-opacity=".9"/>
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity=".42"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity=".75"/>
    </linearGradient>
    <radialGradient id="oc">
      <stop offset="0" stop-color="#f1eaff"/>
      <stop offset="0.42" stop-color="#8b5cf6" stop-opacity=".85"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- дальняя дуга орбиты -->
  <g transform="rotate(-14 50 52)" opacity=".5">
    <path d="M13 52 A37 11 0 0 1 87 52" fill="none" stroke="url(#or)" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <!-- кристалл -->
  <g transform="rotate(6 50 50)">
    <path d="M50 14 L75 36 V60 L50 84 L25 60 V36 Z" fill="url(#of)"/>
    <path d="M50 14 L33 41 M50 14 L67 41 M75 36 L67 41 M25 36 L33 41 M50 84 L33 60 M50 84 L67 60 M33 41 H67 V60 H33 Z" fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="1.2"/>
    <!-- вспышки граней -->
    <path d="M50 14 L33 41 L33 60 L50 84 Z" fill="#c4b5fd">
      <animate attributeName="opacity" values="0;0;0;0.16;0;0" keyTimes="0;0.6;0.72;0.8;0.9;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M50 14 L67 41 L67 60 L50 84 Z" fill="#c4b5fd">
      <animate attributeName="opacity" values="0;0;0;0.14;0;0" keyTimes="0;0.1;0.22;0.3;0.4;1" dur="7.4s" repeatCount="indefinite"/>
    </path>
    <path d="M50 14 L75 36 V60 L50 84 L25 60 V36 Z" fill="none" stroke="url(#or)" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- бегущий свет по кромке -->
    <path d="M50 14 L75 36 V60 L50 84 L25 60 V36 Z" fill="none" stroke="#e8dcff" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="24 185">
      <animate attributeName="stroke-dashoffset" from="0" to="-209" dur="5.6s" repeatCount="indefinite"/>
    </path>
    <path d="M50 19 V81" stroke="#c4b5fd" stroke-opacity=".25" stroke-width="1"/>
    <!-- ядро -->
    <circle cx="50" cy="50" r="9.5" fill="url(#oc)">
      <animate attributeName="opacity" values=".5;1;.5" dur="4.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="59" cy="23" r="1.9" fill="#f3edff" opacity=".6"/>
  </g>
  <!-- ближняя дуга орбиты + летящий спутник -->
  <g transform="rotate(-14 50 52)">
    <path d="M13 52 A37 11 0 0 0 87 52" fill="none" stroke="url(#or)" stroke-width="1.5" stroke-linecap="round"/>
    <g>
      <circle r="3.6" fill="#8b5cf6" fill-opacity=".2"/>
      <circle r="1.7" fill="#e8dcff"/>
      <animateMotion dur="9s" repeatCount="indefinite" path="M13 52 A37 11 0 0 0 87 52 A37 11 0 0 0 13 52"/>
    </g>
  </g>
</svg>
