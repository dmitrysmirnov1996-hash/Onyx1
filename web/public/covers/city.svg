<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="544" viewBox="0 0 1200 544">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#1c1433"/>
      <stop offset="0.45" stop-color="#241846"/>
      <stop offset="1" stop-color="#141024"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2050"/><stop offset="1" stop-color="#191430"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221a3e"/><stop offset="1" stop-color="#120f22"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191430"/><stop offset="1" stop-color="#0c0a18"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cbb8ff" stop-opacity=".9"/>
      <stop offset="0.6" stop-color="#8b5cf6" stop-opacity=".25"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="544" fill="url(#sky)"/>
  <circle cx="1030" cy="96" r="150" fill="url(#moon)"/>
  <circle cx="1030" cy="96" r="34" fill="#d9c9ff" opacity=".85"/>
  <circle cx="1018" cy="88" r="30" fill="#1c1433" opacity=".9"/>
  <!-- задниеVolumes здания -->
  <rect x="0" y="240" width="8%" height="304" fill="url(#b1)"/>
  <rect x="140" y="180" width="120" height="364" fill="url(#b1)"/>
  <rect x="300" y="260" width="90" height="284" fill="url(#b1)"/>
  <rect x="150" y="210" width="14" height="330" fill="#120f22" opacity=".55"/>
  <!-- средние -->
  <rect x="90" y="300" width="200" height="244" fill="url(#b2)"/>
  <rect x="250" y="210" width="150" height="334" fill="url(#b2)"/>
  <rect x="420" y="280" width="170" height="264" fill="url(#b2)"/>
  <rect x="620" y="200" width="130" height="344" fill="url(#b2)"/>
  <rect x="790" y="290" width="210" height="254" fill="url(#b2)"/>
  <!-- передний план -->
  <rect x="380" y="330" width="130" height="214" fill="url(#b3)"/>
  <rect x="560" y="360" width="150" height="184" fill="url(#b3)"/>
  <rect x="730" y="330" width="120" height="214" fill="url(#b3)"/>
  <rect x="880" y="370" width="320" height="174" fill="url(#b3)"/>
