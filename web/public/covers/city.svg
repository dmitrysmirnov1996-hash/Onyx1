    <rect x="262" y="290" width="8" height="10"/><rect x="298" y="266" width="8" height="10"/>
    <rect x="440" y="296" width="8" height="10"/><rect x="458" y="320" width="8" height="10"/>
    <rect x="640" y="216" width="8" height="10"/><rect x="658" y="240" width="8" height="10"/>
    <rect x="816" y="306" width="8" height="10"/><rect x="834" y="330" width="8" height="10"/>
    <rect x="922" y="386" width="8" height="10"/><rect x="940" y="410" width="8" height="10"/>
    <rect x="404" y="346" width="8" height="10"/><rect x="590" y="376" width="8" height="10"/>
